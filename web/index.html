  <!-- Paddle Billing checkout overlay -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    window._paddleReady = false;
    window._paddleLastError = null;
    window._paddleDiag = '';

    window._paddleInit = function(token, sandbox) {
      if (typeof Paddle === 'undefined') {
        console.error('[Paddle] SDK not loaded');
        window._paddleDiag = 'SDK not loaded';
        return;
      }
      if (window._paddleReady) return;
      try {
        if (sandbox) {
          Paddle.Environment.set('sandbox');
          console.log('[Paddle] Environment set to sandbox');
        }
        Paddle.Initialize({
          token: token,
          eventCallback: function(event) {
            console.log('[Paddle] Event:', event.name, event);
            if (event.name === 'checkout.error' || event.name === 'checkout.warning') {
              window._paddleLastError = event;
              console.error('[Paddle] Error/Warning:', JSON.stringify(event));
            }
            if (event.name === 'checkout.loaded') {
              console.log('[Paddle] Checkout loaded OK');
            }
            if (event.name === 'checkout.completed') {
              console.log('[Paddle] Checkout completed successfully');
            }
          },
        });
        window._paddleReady = true;
        window._paddleDiag = 'Init OK (env=' + (sandbox ? 'sandbox' : 'production') + ')';
        console.log('[Paddle] Initialized (env=' + (sandbox ? 'sandbox' : 'production') + ', token=' + token.substring(0, 8) + '…)');
      } catch (e) {
        console.error('[Paddle] Initialize failed:', e);
        window._paddleDiag = 'Init FAILED: ' + e.message;
      }
    };

    window._paddleVerifyPrice = function(priceId) {
      if (typeof Paddle === 'undefined' || !Paddle.PricePreview) {
        console.error('[Paddle] PricePreview not available');
        return;
      }
      console.log('[Paddle] Verifying price:', priceId);
      Paddle.PricePreview({
        items: [{ priceId: priceId, quantity: 1 }],
      }).then(function(result) {
        console.log('[Paddle] PricePreview OK:', JSON.stringify(result));
        window._paddleDiag += ' | Price ' + priceId.substring(0, 12) + '… OK';
      }).catch(function(err) {
        console.error('[Paddle] PricePreview FAILED for ' + priceId + ':', err);
        window._paddleDiag += ' | Price ' + priceId.substring(0, 12) + '… FAILED: ' + (err.message || JSON.stringify(err));
      });
    };

    window._paddleCheckout = function(priceId, uid, email, entitlementScope, productId) {
      if (typeof Paddle === 'undefined') {
        console.error('[Paddle] SDK not loaded – cannot open checkout');
        return;
      }
      if (!window._paddleReady) {
        console.error('[Paddle] Not initialized – call _paddleInit first');
        return;
      }
      try {
        var items = [{ priceId: priceId, quantity: 1 }];
        var checkoutConfig = { items: items };
        var customData = {};
        if (uid) customData.firebase_uid = uid;
        if (entitlementScope) customData.entitlement_scope = entitlementScope;
        if (productId) customData.store_product_id = productId;
        if (Object.keys(customData).length > 0) {
          checkoutConfig.customData = customData;
        }
        if (email) checkoutConfig.customer = { email: email };
        console.log('[Paddle] Opening checkout:', JSON.stringify(checkoutConfig));
        Paddle.Checkout.open(checkoutConfig);
      } catch (e) {
        console.error('[Paddle] Checkout.open failed:', e);
      }
    };
  </script>
